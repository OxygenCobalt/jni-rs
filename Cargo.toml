[package]
authors = ["Josh Chase <josh@prevoty.com>"]
description = "Rust bindings to the JNI"
documentation = "https://docs.rs/jni"
readme = "README.md"
keywords = ["ffi", "jni", "java"]
categories = ["api-bindings"]
license = "MIT/Apache-2.0"
name = "jni"
repository = "https://github.com/jni-rs/jni-rs"
# ¡When bumping version please also update it in examples and documentation!
version = "0.21.1"
edition = "2021"
rust-version = "1.77.0"
exclude = [
    "/.github",
    "/benches",
    "/docs",
    "/example",
    "/tests",
    "/test_profile",
]

[[bench]]
name = "api_calls"
harness = false

[dependencies]
cfg-if = "1.0.0"
cesu8 = { git = "https://github.com/mcountryman/cesu8-rs.git", default-features = false }
combine = { version = "4.1.0", default-features = false }
java-locator = { version = "0.1", optional = true }
jni-sys = "0.4"
libloading = { version = "0.8", optional = true }
log = { version = "0.4.25", default-features = false }
static_assertions = "1"
thiserror = { git = "https://github.com/dtolnay/thiserror.git", default-features = false }

[build-dependencies]
walkdir = "2"

[dev-dependencies]
criterion = { version = "0.4", features = ["html_reports"] }
assert_matches = "1.5.0"
lazy_static = "1"
rusty-fork = "0.3.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.48.0", features = ["Win32_Globalization"] }

[target.'cfg(windows)'.dev-dependencies]
bytemuck = "1.13.0"

[features]
invocation = ["java-locator", "libloading"]
std = []
default = ["std"]

[package.metadata.docs.rs]
features = ["invocation"]

